<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">꿈드림 혜택 찾기 로드맵 — MVP 범위와 이후 범위</title>
  <desc id="desc">수작업 혜택 데이터에서 맞춤 질문, 추천, 진로 로드맵과 신청 체크리스트를 거쳐 자동화와 알림, 멘토 매칭으로 확장되는 범위 비교</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#14324a" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7892a3"/></marker></defs>
  <style>text{font-family:'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#17324d}.title{font-size:34px;font-weight:800}.subtitle{font-size:17px;fill:#587083}.head{font-size:23px;font-weight:800}.body{font-size:17px}.small{font-size:14px;fill:#587083}.card{filter:url(#shadow);stroke-width:2}.flow{stroke:#7892a3;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#7892a3;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}.pill{font-size:14px;font-weight:800}</style>
  <rect width="1600" height="900" fill="#f7fbff"/><text x="75" y="70" class="title">무엇부터 만들고, 무엇을 나중에 만들까?</text><text x="75" y="104" class="subtitle">크롤러보다 손으로 모은 혜택 데이터로 추천 화면부터 만들어 인터뷰에서 반응을 확인합니다</text>
  <rect x="70" y="150" width="720" height="620" rx="26" fill="#ecf8f1" stroke="#70c49a" stroke-width="3"/><rect x="810" y="150" width="720" height="620" rx="26" fill="#f3efff" stroke="#9d85d8" stroke-width="3"/><text x="110" y="205" class="head">1단계 MVP</text><text x="110" y="238" class="small">로그인 없음 · 정적 사이트 · 현장 테스트용</text><text x="850" y="205" class="head">이후 단계</text><text x="850" y="238" class="small">수요와 행동이 확인된 뒤 확장</text>
  <rect x="120" y="285" width="620" height="72" rx="16" fill="#fff" stroke="#70c49a" class="card"/><text x="150" y="316" class="body">① 수작업 혜택 목록</text><text x="150" y="340" class="small">data/processed/*.json</text>
  <path class="flow" d="M430 357 V390"/><rect x="120" y="390" width="620" height="72" rx="16" fill="#fff" stroke="#70c49a" class="card"/><text x="150" y="421" class="body">② 맞춤 질문</text><text x="150" y="445" class="small">나이 · 지역 · 학교 밖 여부 · 진로</text>
  <path class="flow" d="M430 462 V495"/><rect x="120" y="495" width="620" height="72" rx="16" fill="#fff" stroke="#70c49a" class="card"/><text x="150" y="526" class="body">③ 조건 매칭 추천</text><text x="150" y="550" class="small">답변에 맞는 혜택을 우선순위로 보여주기</text>
  <path class="flow" d="M430 567 V600"/><rect x="120" y="600" width="620" height="72" rx="16" fill="#fff" stroke="#70c49a" class="card"/><text x="150" y="631" class="body">④ 진로 로드맵 + 단계별 혜택</text><text x="150" y="655" class="small">지금 할 일부터 다음 단계까지 한눈에</text>
  <path class="flow" d="M430 672 V705"/><rect x="120" y="705" width="620" height="48" rx="16" fill="#d9f5e7" stroke="#70c49a" class="card"/><text x="150" y="736" class="body">⑤ 신청 체크리스트</text>
  <rect x="860" y="285" width="620" height="72" rx="16" fill="#fff" stroke="#9d85d8" class="card"/><text x="890" y="316" class="body">공공 API + 민간 크롤러</text><text x="890" y="340" class="small">혜택 데이터 수집을 자동화</text><path class="flow" d="M1170 357 V390"/>
  <rect x="860" y="390" width="620" height="72" rx="16" fill="#fff" stroke="#9d85d8" class="card"/><text x="890" y="421" class="body">Jev 조건 추출 + LLM 요약</text><text x="890" y="445" class="small">나이·지역·대상·분야·마감일 등 구조화</text><path class="flow" d="M1170 462 V495"/>
  <rect x="860" y="495" width="620" height="72" rx="16" fill="#fff" stroke="#9d85d8" class="card"/><text x="890" y="526" class="body">GitHub Actions</text><text x="890" y="550" class="small">매일 바뀐 공고만 처리</text>
  <rect x="860" y="600" width="285" height="72" rx="16" fill="#fff" stroke="#9d85d8" class="card"/><text x="890" y="631" class="body">마감 알림</text><text x="890" y="655" class="small">수요 확인 후</text><rect x="1175" y="600" width="305" height="72" rx="16" fill="#fff" stroke="#9d85d8" class="card"/><text x="1205" y="631" class="body">멘토 매칭</text><text x="1205" y="655" class="small">로그인 · DB · H4 확인 후</text>
  <path class="dash" d="M740 729 H800 V320 H860"/><text x="755" y="713" class="pill" fill="#587083">센터 테스트 후</text><path class="dash" d="M740 531 H820 V636 H860"/><text x="752" y="555" class="pill" fill="#587083">수요 확인 후</text><path class="dash" d="M740 531 H820 V636 H1175"/><text x="930" y="586" class="pill" fill="#587083">H4 확인 후</text>
  <rect x="70" y="805" width="1460" height="50" rx="25" fill="#17324d"/><text x="800" y="837" text-anchor="middle" fill="#fff" font-size="17">핵심 원칙  ·  먼저 보여주고 반응을 확인한 뒤, 필요한 부분만 자동화합니다</text>
</svg>
