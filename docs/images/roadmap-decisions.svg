<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">꿈드림 혜택 찾기 로드맵 — 단계와 판단 지점</title>
  <desc id="desc">인터뷰 결과에 따라 혜택 찾기, 매칭, 기능 개발과 수익 모델로 갈라지는 의사결정 흐름도</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eef8f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#14324a" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7892a3"/></marker>
    <style>
      text{font-family:'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif;fill:#17324d}
      .title{font-size:34px;font-weight:800}.subtitle{font-size:17px;fill:#587083}.node{filter:url(#shadow);stroke-width:2}.stage{font-size:18px;font-weight:800}.body{font-size:16px}.small{font-size:14px;fill:#587083}.decision{font-size:16px;font-weight:800}.edge{stroke:#7892a3;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{font-size:14px;font-weight:700;fill:#4d6978}.tag{font-size:14px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="1220" fill="url(#bg)"/>
  <text x="80" y="72" class="title">꿈드림 혜택 찾기 로드맵</text>
  <text x="80" y="106" class="subtitle">인터뷰 결과가 다음 단계와 방향을 결정합니다 · 검증 → 사람 손으로 연결 → 필요한 것만 자동화</text>

  <rect x="80" y="145" width="310" height="106" rx="18" fill="#dff1ff" stroke="#6ab2df" class="node"/>
  <text x="105" y="182" class="stage">0단계 · 현장 검증</text><text x="105" y="211" class="body">꿈드림 봉사 + 청소년·선생님 인터뷰</text><text x="105" y="236" class="small">2026.10 ~ 12</text>
  <path class="edge" d="M390 198 H472"/>
  <polygon points="560,140 650,198 560,256 470,198" fill="#fff1c9" stroke="#e0ae42" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="191" text-anchor="middle" class="decision">H1</text><text x="560" y="214" text-anchor="middle" class="small">정보를 못 찾아</text><text x="560" y="233" text-anchor="middle" class="small">혜택을 놓치나?</text>
  <path class="edge" d="M560 256 V330"/><text x="580" y="300" class="label">예</text>
  <path class="edge" d="M650 198 H792"/><text x="704" y="181" class="label">아니오: 동기·막막함</text>
  <rect x="792" y="145" width="300" height="106" rx="18" fill="#e9e2ff" stroke="#9d85d8" class="node"/><text x="817" y="182" class="stage">바로 전환</text><text x="817" y="211" class="body">매칭 중심으로 이동</text><text x="817" y="236" class="small">2단계로 바로 이동</text>
  <rect x="410" y="330" width="300" height="106" rx="18" fill="#d9f5e7" stroke="#70c49a" class="node"/><text x="435" y="367" class="stage">1단계 · 혜택 찾기 MVP</text><text x="435" y="396" class="body">손으로 모은 혜택 30~50개</text><text x="435" y="421" class="small">맞춤 질문과 추천 화면</text>
  <path class="edge" d="M560 436 V507"/>
  <polygon points="560,507 650,565 560,623 470,565" fill="#fff1c9" stroke="#e0ae42" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="558" text-anchor="middle" class="decision">H2</text><text x="560" y="581" text-anchor="middle" class="small">선생님이 다 챙겨</text><text x="560" y="600" text-anchor="middle" class="small">주지 못하나?</text>
  <path class="edge" d="M470 565 H300 V670"/><text x="330" y="548" class="label">예</text>
  <path class="edge" d="M650 565 H820 V670"/><text x="700" y="548" class="label">아니오</text>
  <rect x="160" y="670" width="280" height="94" rx="18" fill="#dff1ff" stroke="#6ab2df" class="node"/><text x="185" y="707" class="stage">청소년이 직접 쓰는 도구</text><text x="185" y="736" class="small">스스로 찾고 신청하기</text>
  <rect x="680" y="670" width="280" height="94" rx="18" fill="#dff1ff" stroke="#6ab2df" class="node"/><text x="705" y="707" class="stage">선생님용 도구</text><text x="705" y="736" class="small">또는 센터 밖 청소년 대상</text>
  <path class="edge" d="M300 764 V822 H560"/><path class="edge" d="M820 764 V822 H560"/>
  <polygon points="560,822 650,880 560,938 470,880" fill="#fff1c9" stroke="#e0ae42" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="873" text-anchor="middle" class="decision">H3</text><text x="560" y="896" text-anchor="middle" class="small">서울 원스톱서비스가</text><text x="560" y="915" text-anchor="middle" class="small">틈을 메우고 있나?</text>
  <path class="edge" d="M470 880 H260 V1000"/><text x="298" y="862" class="label">서울은 틈이 작음</text>
  <path class="edge" d="M650 880 H860 V1000"/><text x="705" y="862" class="label">틈이 있음</text>
  <rect x="120" y="1000" width="280" height="88" rx="18" fill="#e9e2ff" stroke="#9d85d8" class="node"/><text x="145" y="1037" class="stage">비서울 지역부터</text><text x="145" y="1065" class="small">지역 확장으로 검증</text>
  <rect x="720" y="1000" width="280" height="88" rx="18" fill="#e9e2ff" stroke="#9d85d8" class="node"/><text x="745" y="1037" class="stage">전국 대상</text><text x="745" y="1065" class="small">전국 범위로 검증</text>
  <path class="edge" d="M260 1088 V1140 H560"/><path class="edge" d="M860 1088 V1140 H560"/>
  <rect x="410" y="1140" width="300" height="70" rx="18" fill="#cdeedc" stroke="#63ae88" class="node"/><text x="560" y="1169" text-anchor="middle" class="stage">2단계 · 사람이 직접 매칭</text><text x="560" y="1193" text-anchor="middle" class="small">선생님을 통해 멘토 연결</text>
  <path class="edge" d="M1092 198 H1350 V345"/><path class="edge" d="M710 383 H1350 V345"/>
  <rect x="1180" y="300" width="300" height="90" rx="18" fill="#cdeedc" stroke="#63ae88" class="node"/><text x="1205" y="337" class="stage">2단계로 합류</text><text x="1205" y="366" class="small">매칭을 사람 손으로 검증</text>
  <path class="edge" d="M1350 390 V470"/>
  <polygon points="1350,470 1440,528 1350,586 1260,528" fill="#fff1c9" stroke="#e0ae42" stroke-width="2" filter="url(#shadow)"/><text x="1350" y="521" text-anchor="middle" class="decision">H4</text><text x="1350" y="544" text-anchor="middle" class="small">연결되면 실제로</text><text x="1350" y="563" text-anchor="middle" class="small">행동하나?</text>
  <path class="edge" d="M1260 528 H1150 V665"/><text x="1180" y="510" class="label">아니오</text><path class="edge" d="M1440 528 H1510 V665"/><text x="1450" y="510" class="label">예</text>
  <rect x="1010" y="665" width="280" height="88" rx="18" fill="#ffe0e2" stroke="#df7d86" class="node"/><text x="1035" y="702" class="stage">매칭·수익 모델 재검토</text><text x="1035" y="730" class="small">가설을 다시 세우기</text>
  <rect x="1370" y="665" width="210" height="88" rx="18" fill="#cdeedc" stroke="#63ae88" class="node"/><text x="1395" y="702" class="stage">3단계 · 기능 개발</text><text x="1395" y="730" class="small">로그인·DB 도입</text>
  <path class="edge" d="M1475 753 V835"/>
  <polygon points="1475,835 1550,883 1475,931 1400,883" fill="#fff1c9" stroke="#e0ae42" stroke-width="2" filter="url(#shadow)"/><text x="1475" y="877" text-anchor="middle" class="decision">H5</text><text x="1475" y="900" text-anchor="middle" class="small">기업이 돈을</text><text x="1475" y="919" text-anchor="middle" class="small">낼까?</text>
  <path class="edge" d="M1400 883 H1240 V1000"/><text x="1280" y="865" class="label">아니오</text><path class="edge" d="M1550 883 V1000"/><text x="1550" y="970" text-anchor="end" class="label">예</text>
  <rect x="1100" y="1000" width="280" height="88" rx="18" fill="#dff1ff" stroke="#6ab2df" class="node"/><text x="1125" y="1037" class="stage">B2G·기관 구독 우선</text><text x="1125" y="1065" class="small">기관 중심 지속 가능성 검토</text>
  <rect x="1370" y="1000" width="210" height="88" rx="18" fill="#d9f5e7" stroke="#70c49a" class="node"/><text x="1395" y="1037" class="stage">4단계 · 기업 사회공헌</text><text x="1395" y="1065" class="small">+ 임팩트 리포트</text>
</svg>
