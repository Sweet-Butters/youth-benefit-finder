name: collect

# 공식 출처에서 혜택을 모아 data/collected/에 커밋한다 (docs/collection-strategy.md).
# 매일 06:00 KST에 돈다 (2026-09-27 첫 수동 실행 성공 뒤 켬). 끝나면 deploy가 사이트를 다시 만든다.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST

permissions:
  contents: write
  issues: write   # 수집 경고·주간 요약 이슈

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}   # 없으면 규칙만으로 판단
        run: python -m crawler.main
      - name: Health check
        # 이틀 연속 실패하거나 평소의 절반 아래로 떨어진 출처가 있으면 이슈, 월요일(KST)에는 주간 요약도.
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then python scripts/collect_health.py --weekly; else python scripts/collect_health.py; fi
      - uses: actions/upload-artifact@v4
        with:
          name: review
          path: data/collected/review.json
          retention-days: 14
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected
          if ! git diff --cached --quiet; then git commit -m "collect: $(date -u +%F)" && git push; fi
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s .health-alert.md ] || exit 0
          gh label create collect-alert --color d93f0b --description "수집기 경고·주간 요약" 2>/dev/null || true
          n=$(gh issue list --label collect-alert --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file .health-alert.md
          else gh issue create --title "수집기 알림 $(TZ=Asia/Seoul date +%F)" --label collect-alert --body-file .health-alert.md; fi
