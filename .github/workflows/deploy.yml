name: deploy

# Publishes web/ to Cloudflare Workers: https://jinro.mandeun.com (web/wrangler.jsonc)
# Runs on every push to main (which covers any change under data/collected), by hand, and after
# the collect workflow finishes: its commits are pushed with GITHUB_TOKEN, and GitHub does not
# start other workflows' push triggers for those, so workflow_run picks them up instead.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [collect]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jinro.mandeun.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main        # after a collect run, build the commit it just pushed
          fetch-depth: 0   # the validator compares ids against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Validate data
        run: |
          npm ci
          npm run validate
      - name: Build site
        working-directory: web
        env:
          # GoatCounter code for public view counts (D25). Repo variable, not a secret; unset = no counting.
          PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: |
          npm ci
          npm run build
      - name: Deploy to Cloudflare
        # 토큰이 없으면 배포를 건너뛰지 않고 실패한다 — 조용히 옛 사이트가 남는 쪽이 더 위험하다.
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
