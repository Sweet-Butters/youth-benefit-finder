name: deploy

# Publishes web/ to GitHub Pages: https://sweet-butters.github.io/youth-benefit-finder/
# Runs on every push to main (which covers any change under data/collected), by hand, and after
# the collect workflow finishes: its commits are pushed with GITHUB_TOKEN, and GitHub does not
# start other workflows' push triggers for those, so workflow_run picks them up instead.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [collect]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main        # after a collect run, build the commit it just pushed
          fetch-depth: 0   # the validator compares ids against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Validate data
        run: |
          npm ci
          npm run validate
      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
